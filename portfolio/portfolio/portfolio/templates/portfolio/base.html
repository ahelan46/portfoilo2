<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="My Portfolio - Showcase of projects and skills">
    <title>{% block title %}My Portfolio{% endblock %}</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: auto;
        }
        
        body {
            background-color: #F8FAFC;
            color: #1F2937;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
           
            background-image:none;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        header {
            background-color:#0F172A;
            color: white;
            padding: 1rem 0;
            position: sticky;
            top: 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            z-index: 100;
            width: 100%;
        }
        
        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 1.5rem;
            transition: opacity 0.3s;
            font-size: 1rem;
        }
        
        nav a:hover {
            opacity: 0.8;
        }
        
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 6px;
            margin: 0;
        }
        
        .hamburger span {
            width: 25px;
            height: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 2px;
        }
        
        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(10px, 10px);
        }
        
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -7px);
        }
        
        .nav-right {
            display: flex;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
        }
        
        .social-icons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        
        .social-icons a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1.5px solid white;
            margin: 0;
        }
        
        .social-icons a:hover {
            background-color: white;
            color: #667eea;
            opacity: 1;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            margin-top: 2rem;
            margin-bottom: 2rem;
        }
        
        main {
            flex: 1;
        }
        
        footer {
            background-color: #020617;
            color: #9CA3AF;
                  /* reduced height */
            display: flex;
            align-items: center;       /* vertical center */
            justify-content: center;   /* center paragraph */
            position: relative; 
            overflow: visible; 
            padding: 10px 0;
      /* needed for right toggle */
        }
        footer p {
            margin: 0;
            text-align: center;
            font-size: 0.9rem;   /* optional: slightly smaller */
        }
        footer #theme-toggle {
            position: absolute;
            right: 35px;
            top: 50%;
            transform: translateY(-50%);
        }

        .btn {
            background-color: #2563EB;
            border-radius: 8px;
            font-weight: 500;
            display: inline-block;
            padding: 0.75rem 1.5rem;
           
            color: white;
            text-decoration: none;
            border: none;
            
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .btn:hover {
            background-color: #1D4ED8;
        }
        
        .btn-secondary {
            background-color: #E5E7EB;
            color: #1F2937;
        }
        
        .btn-secondary:hover {
            background-color: #D1D5DB;
        }

        .social-icons a {
            border: 1.5px solid #38BDF8;
            color: #38BDF8;
            position: relative; /* needed for the tooltip */
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            margin: 0;
        }

        /* Tooltip for icon names */
        .social-icons a::after {
            content: attr(data-tooltip); /* grabs the title attribute */
            position: absolute;
            background-color: #38BDF8;
            color: #020617;
            top: 120%; /* above the icon */
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            padding: 3px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15); /* optional subtle shadow */
            transition: all 0.3s ease;
        }

        /* Hover effect */
        .social-icons a:hover {
            background-color: white;
            color: #667eea;
            transform: translateY(-5px); /* move the icon up */
        }

        .social-icons a:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0); /* move tooltip into view */
        }

       #theme-toggle {
    position: relative; /* required for tooltip */
    
    width: 45px;
    height: 45px;
    background-color: transparent;
    color: yellow;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.5rem;
    transition: transform 0.3s ease, color 0.3s ease;
}

#theme-toggle:hover {
    
    color: #FFA500;
}

/* Tooltip */
#theme-toggle::after {
    content: attr(data-tooltip);
    position: absolute;
    top: -38px;                 /* 👈 move ABOVE the button */
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background-color: white;
    color: black;
    padding: 4px 8px;
    font-size: 0.75rem;
    border-radius: 4px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 999;              /* 👈 important */
}

/* Show tooltip on hover */

#theme-toggle:hover::after {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}


body.dark-mode #theme-toggle {
    color: #ffd700;
}
/* Dark mode styles */
body.dark-mode {
    background-color: #020617;
    color: #E5E7EB;
    background-image: none; /* remove background image if needed */
}

body.dark-mode header {
    background: linear-gradient(135deg, #333 0%, #555 100%);
}

body.dark-mode footer {
    background-color: #222;
    color: #e0e0e0;
}

body.dark-mode .btn {
    background-color: #555;
}

body.dark-mode .btn:hover {
    background-color: #777;
}

body.dark-mode .btn-secondary {
    background-color: #444;
}

body.dark-mode .btn-secondary:hover {
    background-color: #666;
}

body.dark-mode .social-icons a {
    border: 1.5px solid #e0e0e0;
}

body.dark-mode .social-icons a:hover {
    background-color: #e0e0e0;
    color: #333;
}
body.dark-mode #theme-toggle {
    color: #ffd700;
}

body.dark-mode main {
    background-color: transparent;
}
/* ===== NEON NAV HOVER EFFECT (LIKE IMAGE) ===== */

.nav-links a {
    position: relative;
    padding: 6px 4px;
    color: #E5E7EB;
    font-weight: 500;
    letter-spacing: 0.5px;
    transition: color 0.3s ease, text-shadow 0.3s ease;
}

/* underline */
.nav-links a::after {
    background: #38BDF8;
    box-shadow: 0 0 6px rgba(56,189,248,0.6);
    content: "";
    position: absolute;
    left: 0;
    bottom: -6px;
    width: 0%;
    height: 2px;
    transition: width 0.35s ease;
}

/* hover glow */
.nav-links a:hover {
    color: #38BDF8;
    text-shadow: 0 0 6px rgba(56,189,248,0.5);
}

/* underline animation */
.nav-links a:hover::after {
    width: 100%;
}


        
        @media (max-width: 1024px) {
            nav {
                padding: 0 1.5rem;
            }
        }
        
        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }
            
            .nav-right {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background-color: #0F172A;
                padding: 1.5rem;
                box-shadow: 0 4px 20px rgba(0,0,0,0.25);
                width: 100%;
                gap: 1rem;
                z-index: 99;
            }
            
            .nav-right.active {
                display: flex;
            }
            
            .nav-links {
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }
            
            nav a {
                margin: 0.5rem 0;
                font-size: 0.95rem;
            }
            
            .container {
                padding: 1rem;
                margin: 1rem auto;
            }
            
            .social-icons {
                flex-wrap: wrap;
                justify-content: flex-start;
            }
            
            header {
                padding: 0.75rem 0;
            }
        }
        
        @media (max-width: 480px) {
            nav {
                padding: 0 1rem;
            }
            
            .logo {
                font-size: 1.2rem;
            }
            
            nav a {
                font-size: 0.9rem;
            }
            
            .social-icons a {
                width: 30px;
                height: 30px;
                font-size: 0.9rem;
            }
            
            .social-icons a::after {
                font-size: 0.7rem;
            }
            
            footer {
                padding: 8px 0;
                flex-wrap: wrap;
            }
            
            footer p {
                font-size: 0.75rem;
                padding: 0 0.5rem;
            }
            
            #theme-toggle {
                width: 40px;
                height: 40px;
                right: 15px;
                font-size: 1.2rem;
            }
            
            .btn {
                padding: 0.6rem 1.2rem;
                font-size: 0.9rem;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <nav class="hed">
            <div class="logo"><a href="{% url 'portfolio:home' %}" style="color: white; text-decoration: none;">My Portfolio</a></div>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="nav-right" id="navRight">
                <div class="nav-links">
                    <a href="{% url 'portfolio:home' %}">Home</a>
                    <a href="{% url 'portfolio:about' %}">About</a>
                    <a href="{% url 'portfolio:project_list' %}">Projects</a>
                    <a href="{% url 'portfolio:skills' %}">Skills</a>
                    <a href="{% url 'portfolio:contact' %}">Contact</a>
                </div>
                <div class="social-icons">
                    <a href="https://github.com/yourprofile" target="_blank" data-tooltip="GitHub">
                        <i class="fab fa-github"></i>
                    </a>
                    <a href="https://linkedin.com/in/yourprofile" target="_blank" data-tooltip="LinkedIn">
                        <i class="fab fa-linkedin-in"></i>
                    </a>
                    <a href="https://instagram.com/yourprofile" target="_blank" data-tooltip="Instagram">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="https://wa.me/1234567890" target="_blank" data-tooltip="WhatsApp">
                        <i class="fab fa-whatsapp"></i>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        {% block content %}
        
        {% endblock %}
    </main>

    <footer>
        <p>&copy; <span id="current-year"></span> My Portfolio. All rights reserved.</p>

       <div id="theme-toggle" data-tooltip="Dark / Light Mode">
    <i class="fas fa-moon"></i>
</div>

</div>
    </footer>
</body>
</html>
<script>
    document.getElementById("current-year").textContent = new Date().getFullYear();

    // Mobile Hamburger Menu Toggle
    const hamburger = document.getElementById('hamburger');
    const navRight = document.getElementById('navRight');
    
    hamburger.addEventListener('click', () => {
        hamburger.classList.toggle('active');
        navRight.classList.toggle('active');
    });
    
    // Close menu when a link is clicked
    const navLinks = navRight.querySelectorAll('a');
    navLinks.forEach(link => {
        link.addEventListener('click', () => {
            hamburger.classList.remove('active');
            navRight.classList.remove('active');
        });
    });

    // Dark/Light Mode Toggle
    const toggle = document.getElementById('theme-toggle');

    // Check saved mode in localStorage
    if(localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
        toggle.innerHTML = '<i class="fas fa-sun"></i>';
    }

    toggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');

        // Change icon
        if(document.body.classList.contains('dark-mode')){
            toggle.innerHTML = '<i class="fas fa-sun"></i>';
            localStorage.setItem('theme', 'dark');
        } else {
            toggle.innerHTML = '<i class="fas fa-moon"></i>';
            localStorage.setItem('theme', 'light');
        }
    });
</script>
