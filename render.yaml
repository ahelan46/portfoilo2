services:
  - type: web
    name: portfolio-web
    env: python
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT portfolio.mysite.wsgi:application
    workingDirectory: portfolio
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: mysite.settings_prod
      - key: DJANGO_DEBUG
        value: 'False'
    postDeploy:
      - command: cd portfolio && python manage.py migrate
      - command: cd portfolio && python manage.py collectstatic --noinput

# If you want a managed Postgres service, create it via Render UI and attach its
# `DATABASE_URL` to this service (Render will set the env var automatically).
