services:
  - type: web
    name: portfolio-web
    env: python
    plan: starter
    branch: main
    buildCommand: cd portfolio && pip install -r requirements.txt
    startCommand: cd portfolio && gunicorn mysite.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: mysite.settings_prod
      - key: DJANGO_DEBUG
        value: 'False'
      - key: PYTHONUNBUFFERED
        value: '1'
      - key: PYTHONPATH
        value: /opt/render/project/src/portfolio
    postDeploy:
      - command: cd portfolio && python manage.py migrate
      - command: cd portfolio && python manage.py collectstatic --noinput

# If you want a managed Postgres service, create it via Render UI and attach its
# `DATABASE_URL` to this service (Render will set the env var automatically).
