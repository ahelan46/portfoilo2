services:
  - type: web
    name: portfolio-web
    env: python
    plan: starter
    branch: main
    buildCommand: cd portfolio/frontend && npm install && npm run build && cd .. && pip install -r requirements.txt
    startCommand: gunicorn --chdir portfolio mysite.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: mysite.settings_prod
      - key: DJANGO_DEBUG
        value: 'False'
      - key: PYTHONUNBUFFERED
        value: '1'
    postDeploy:
      - command: cd portfolio && DJANGO_SETTINGS_MODULE=mysite.settings_prod python manage.py migrate --noinput
      - command: cd portfolio && DJANGO_SETTINGS_MODULE=mysite.settings_prod python manage.py collectstatic --noinput
      - command: cd portfolio && DJANGO_SETTINGS_MODULE=mysite.settings_prod python seed_about.py
      - command: cd portfolio && DJANGO_SETTINGS_MODULE=mysite.settings_prod python seed_experience.py
      - command: cd portfolio && DJANGO_SETTINGS_MODULE=mysite.settings_prod python seed_cta.py
      - command: cd portfolio && DJANGO_SETTINGS_MODULE=mysite.settings_prod python seed_certifications.py
